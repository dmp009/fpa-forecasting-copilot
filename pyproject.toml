[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpacopilot"
version = "0.1.0"
description = "FP&A copilot: budget vs actual, price/volume/mix bridge, backtested forecast and checked variance commentary on real retail sales."
requires-python = ">=3.11"
dependencies = [
  "requests",
  "pandas>=2.2",
  "numpy",
  "pyarrow",
  "openpyxl",
  "duckdb>=1.1",
  "pandera>=0.24",
  "pyyaml",
  "scikit-learn>=1.5",
  "anthropic",
  "plotly",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["fpacopilot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/Home.py" = ["N999", "E402"]
"app/pages/*.py" = ["N999"]
"app/common.py" = ["E402"]
